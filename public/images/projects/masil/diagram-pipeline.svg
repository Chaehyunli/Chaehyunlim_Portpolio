<svg viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', ui-monospace, monospace">
  <title id="title">Masil AI Agent 파이프라인</title>
  <desc id="desc">요청 수신부터 SSE 응답까지 5단계 개요와, itinerary 타입만 진입하는 Phase 1~4 상세 흐름. 나머지 4개 타입은 STEP 4에서 STEP 5로 바로 응답한다. 점선 테두리는 LLM 호출(pydantic-ai), 실선 테두리는 알고리즘·인프라 처리를 뜻하며 ✓는 DeepEval 골든 데이터셋 검증 구간이다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="730" fill="#ffffff"/>

  <text x="700" y="26" text-anchor="middle" font-size="13" letter-spacing="0.03em" fill="#000000">Masil — AI Agent 파이프라인 <tspan fill="#9ca3af">· LLM ↔ 알고리즘 경계</tspan></text>

  <!-- Top row arrows -->
  <line x1="260" y1="155" x2="300" y2="155" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="155" x2="560" y2="155" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="780" y1="155" x2="820" y2="155" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="1040" y1="155" x2="1080" y2="155" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- N1 사용자 입력 -->
  <g>
    <text x="54" y="52" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 1</text>
    <rect x="40" y="70" width="220" height="170" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="54" y="98" font-size="14" font-weight="700" fill="#000000">사용자 입력</text>
    <text x="54" y="122" font-size="10" fill="#9ca3af">자연어 메시지</text>
    <text x="54" y="136" font-size="10" fill="#9ca3af">POST /api/v1/ai-messages</text>
    <text x="54" y="220" font-size="9" fill="#9ca3af">Spring WebFlux</text>
  </g>

  <!-- N2 컨텍스트 로드 -->
  <g>
    <text x="314" y="52" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 2</text>
    <rect x="300" y="70" width="220" height="170" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="314" y="98" font-size="14" font-weight="700" fill="#000000">컨텍스트 로드</text>
    <text x="314" y="122" font-size="10" fill="#9ca3af">Redis · DB · pgvector 조회</text>
    <text x="314" y="136" font-size="10" fill="#9ca3af">대화 이력 병합</text>
    <text x="314" y="220" font-size="9" fill="#9ca3af">R2DBC</text>
  </g>

  <!-- N3 요청 분류 : LLM -->
  <g>
    <text x="574" y="52" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 3</text>
    <rect x="560" y="70" width="220" height="170" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="574" y="98" font-size="14" font-weight="700" fill="#000000">요청 분류</text>
    <text x="574" y="122" font-size="10" fill="#9ca3af">classification_agent</text>
    <text x="574" y="136" font-size="10" fill="#9ca3af">cancel·chat·itinerary</text>
    <text x="574" y="150" font-size="10" fill="#9ca3af">change·reservation 판별</text>
    <text x="574" y="212" font-size="9" fill="#9ca3af">LLM · pydantic-ai</text>
    <text x="574" y="226" font-size="9" fill="#9ca3af">Token Bucket 레이트리밋</text>
  </g>

  <!-- N4 타입별 실행 -->
  <g>
    <text x="834" y="52" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 4</text>
    <rect x="820" y="70" width="220" height="170" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="834" y="98" font-size="14" font-weight="700" fill="#000000">타입별 실행</text>
    <text x="834" y="122" font-size="10" fill="#9ca3af">itinerary → Phase 1~4</text>
    <text x="834" y="136" font-size="10" fill="#9ca3af">나머지 4종 → 단일 응답</text>
    <text x="834" y="220" font-size="9" fill="#9ca3af">FastAPI 라우팅</text>
  </g>

  <!-- N5 SSE 스트리밍 : 종착 노드, 강조 stroke -->
  <g>
    <text x="1094" y="52" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 5</text>
    <rect x="1080" y="70" width="220" height="170" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    <text x="1094" y="98" font-size="14" font-weight="700" fill="#000000">SSE 스트리밍</text>
    <text x="1094" y="122" font-size="10" fill="#9ca3af">일정·응답 청크 전송</text>
    <text x="1094" y="136" font-size="10" fill="#9ca3af">실시간 응답</text>
    <text x="1094" y="220" font-size="9" fill="#9ca3af">FastAPI → 클라이언트</text>
  </g>

  <!-- Branch: N4 → Phase 1 (itinerary만 진입, 나머지 4종은 위 STEP4→STEP5 화살표로 직행) -->
  <path d="M950,240 L950,300 L345,300 L345,340" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="960" y="293" font-size="9" fill="#9ca3af">itinerary만 진입</text>

  <!-- Phase grid arrows (실행 순서: 1→2→3→4) -->
  <line x1="650" y1="410" x2="690" y2="410" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M995,480 L995,512 L345,512 L345,520" fill="none" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="650" y1="590" x2="690" y2="590" stroke="#000000" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Phase 1 데이터 수집 (병렬) : Algorithm -->
  <g>
    <text x="54" y="322" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 4-1</text>
    <rect x="40" y="340" width="610" height="140" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="54" y="370" font-size="14" font-weight="700" fill="#000000">Phase 1. 데이터 수집 (병렬)</text>
    <text x="610" y="370" text-anchor="end" font-size="16" font-weight="700" fill="#000000">✓</text>
    <text x="54" y="396" font-size="10" fill="#374151"><tspan font-weight="700" fill="#000000">Tavily</tspan> 웹요약 · 날씨 조회</text>
    <text x="54" y="412" font-size="10" fill="#374151">항공 구간 · 숙소 조회</text>
    <text x="54" y="450" font-size="9" fill="#9ca3af">알고리즘 · 외부 API 병렬 호출, LLM 0회</text>
  </g>

  <!-- Phase 2 일정 계획 : LLM -->
  <g>
    <text x="704" y="322" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 4-2</text>
    <rect x="690" y="340" width="610" height="140" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="704" y="370" font-size="14" font-weight="700" fill="#000000">Phase 2. 일정 계획</text>
    <text x="1260" y="370" text-anchor="end" font-size="16" font-weight="700" fill="#000000">✓</text>
    <text x="704" y="396" font-size="10" fill="#374151"><tspan font-weight="700" fill="#000000">planner_agent</tspan> · 항공/숙소 선택</text>
    <text x="704" y="412" font-size="10" fill="#374151">날짜별 방문 순서 확정</text>
    <text x="704" y="450" font-size="9" fill="#9ca3af">LLM · pydantic-ai</text>
  </g>

  <!-- Phase 3 장소/동선 (병렬) : Algorithm -->
  <g>
    <text x="54" y="498" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 4-3</text>
    <rect x="40" y="520" width="610" height="140" fill="#ffffff" stroke="#000000" stroke-width="1"/>
    <text x="54" y="550" font-size="14" font-weight="700" fill="#000000">Phase 3. 장소/동선 (병렬)</text>
    <text x="610" y="550" text-anchor="end" font-size="16" font-weight="700" fill="#000000">✓</text>
    <text x="54" y="576" font-size="10" fill="#374151"><tspan font-weight="700" fill="#000000">Google Places</tspan> · <tspan font-weight="700" fill="#000000">Routes</tspan></text>
    <text x="54" y="592" font-size="10" fill="#374151">관광지 입장료 검색</text>
    <text x="54" y="630" font-size="9" fill="#9ca3af">알고리즘 · 외부 API 병렬 호출, LLM 0회</text>
  </g>

  <!-- Phase 4 일정 생성 : LLM -->
  <g>
    <text x="704" y="498" font-size="9" font-weight="700" letter-spacing="0.06em" fill="#000000">STEP 4-4</text>
    <rect x="690" y="520" width="610" height="140" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="704" y="550" font-size="14" font-weight="700" fill="#000000">Phase 4. 일정 생성</text>
    <text x="1260" y="550" text-anchor="end" font-size="16" font-weight="700" fill="#000000">✓</text>
    <text x="704" y="576" font-size="10" fill="#374151"><tspan font-weight="700" fill="#000000">synthesizer_agent</tspan> · 일정 스트리밍 생성</text>
    <text x="704" y="592" font-size="10" fill="#374151">클라이언트 전달</text>
    <text x="704" y="630" font-size="9" fill="#9ca3af">LLM · pydantic-ai</text>
  </g>

  <!-- Legend -->
  <rect x="330" y="694" width="40" height="20" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="378" y="708" font-size="11" fill="#000000">알고리즘 · 인프라</text>

  <rect x="580" y="694" width="40" height="20" fill="#ffffff" stroke="#000000" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="628" y="708" font-size="11" fill="#000000">LLM 호출 (pydantic-ai)</text>

  <text x="850" y="708" font-size="14" font-weight="700" fill="#000000">✓</text>
  <text x="870" y="708" font-size="11" fill="#000000">DeepEval 골든 데이터셋 검증 구간</text>
</svg>
