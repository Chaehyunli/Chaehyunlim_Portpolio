<svg viewBox="0 0 1200 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', ui-monospace, monospace">
  <title id="title">Searchive 대표 태그 결정과 검색 응답 흐름</title>
  <desc id="desc">후보 태그를 정확한 이름, 벡터 유사도, 신규 생성 순으로 결정하고, 배치 검색과 RAG 질의응답으로 이어지는 흐름이다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6B7685"/></marker>
  </defs>
  <rect width="1200" height="610" fill="#F2F4F6"/>
  <text x="56" y="54" font-size="20" font-weight="700" fill="#191F28">대표 태그 결정에서 검색·응답까지</text>
  <text x="56" y="82" font-size="14" fill="#6B7685">정확한 일치부터 유사도 판단까지 순서대로 확인한 뒤, 검색 요청을 묶어 RAG 응답으로 연결</text>

  <g>
    <text x="474" y="126" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7685">STEP 4</text>
    <rect x="390" y="144" width="420" height="90" rx="12" fill="#fff" stroke="#E5E8EB" stroke-width="2"/>
    <text x="414" y="181" font-size="19" font-weight="700" fill="#191F28">TagService · 대표 태그 결정</text>
    <text x="414" y="210" font-size="14" fill="#6B7685">일치 여부를 우선순위대로 평가</text>
  </g>

  <line x1="600" y1="234" x2="600" y2="266" stroke="#6B7685" stroke-width="2"/>
  <line x1="200" y1="266" x2="1000" y2="266" stroke="#6B7685" stroke-width="2"/>
  <line x1="200" y1="266" x2="200" y2="288" stroke="#6B7685" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="266" x2="600" y2="288" stroke="#6B7685" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1000" y1="266" x2="1000" y2="288" stroke="#6B7685" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <rect x="56" y="296" width="288" height="120" rx="12" fill="#fff" stroke="#E5E8EB" stroke-width="2"/>
    <text x="80" y="322" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7685">STEP 4-1 · 우선순위 1</text>
    <text x="80" y="356" font-size="18" font-weight="700" fill="#191F28">이름 완전 일치</text>
    <text x="80" y="386" font-size="14" fill="#6B7685">기존 대표 태그 재사용</text>
  </g>
  <g>
    <rect x="456" y="296" width="288" height="120" rx="12" fill="#fff" stroke="#E5E8EB" stroke-width="2"/>
    <text x="480" y="322" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7685">STEP 4-2 · 우선순위 2</text>
    <text x="480" y="356" font-size="18" font-weight="700" fill="#191F28">벡터 유사도 ≥ 0.8</text>
    <text x="480" y="386" font-size="14" fill="#6B7685">기존 대표 태그로 수렴</text>
  </g>
  <g>
    <rect x="856" y="296" width="288" height="120" rx="12" fill="#fff" stroke="#E5E8EB" stroke-width="2"/>
    <text x="880" y="322" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7685">STEP 4-3 · 마지막</text>
    <text x="880" y="356" font-size="18" font-weight="700" fill="#191F28">둘 다 없음</text>
    <text x="880" y="386" font-size="14" fill="#6B7685">새 대표 태그 생성</text>
  </g>

  <line x1="200" y1="416" x2="200" y2="438" stroke="#6B7685" stroke-width="2"/>
  <line x1="600" y1="416" x2="600" y2="438" stroke="#6B7685" stroke-width="2"/>
  <line x1="1000" y1="416" x2="1000" y2="438" stroke="#6B7685" stroke-width="2"/>
  <line x1="200" y1="438" x2="1000" y2="438" stroke="#6B7685" stroke-width="2"/>
  <line x1="600" y1="438" x2="600" y2="460" stroke="#6B7685" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="786" y1="515" x2="830" y2="515" stroke="#6B7685" stroke-width="2" marker-end="url(#arrow)"/>

  <g>
    <text x="414" y="452" font-size="12" font-weight="700" letter-spacing="1.2" fill="#6B7685">STEP 5</text>
    <rect x="414" y="470" width="372" height="92" rx="12" fill="#fff" stroke="#E5E8EB" stroke-width="2"/>
    <text x="438" y="506" font-size="18" font-weight="700" fill="#191F28">검색 최적화 · _msearch</text>
    <text x="438" y="535" font-size="14" fill="#6B7685">N개 KNN 쿼리를 1회 요청으로 묶음</text>
  </g>
  <g>
    <text x="830" y="452" font-size="12" font-weight="700" letter-spacing="1.2" fill="#3182F6">STEP 6 · LLM</text>
    <rect x="830" y="470" width="314" height="92" rx="12" fill="#fff" stroke="#3182F6" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="854" y="506" font-size="18" font-weight="700" fill="#191F28">RAG 질의응답</text>
    <text x="854" y="535" font-size="14" fill="#6B7685">검색 결과를 근거로 답변 생성</text>
  </g>
</svg>
