<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="'JetBrains Mono', ui-monospace, monospace">
  <title id="title">모두약속 AI 일정 생성 파이프라인</title>
  <desc id="desc">사용자 조건 입력부터 동선 보강까지 6단계 흐름. 윗줄 STEP 1 → 1.5 → 2, 아랫줄 STEP 3-① → 3-② → 4로 이어진다. Step 3은 규칙 기반 하드 필터로 먼저 걸러낸 뒤 살아남은 후보만 LLM을 1회 호출하는 순서다. 점선 테두리는 LLM 호출, 실선 테두리는 알고리즘 처리를 뜻한다.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0B8C1"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="430" fill="#FFFFFF"/>
  <text x="20" y="24" font-size="12.5" font-weight="700" fill="#191F28">AI 일정 생성 파이프라인 <tspan fill="#8B95A1" font-weight="400">· LLM ↔ 알고리즘 경계</tspan></text>

  <!-- Legend (top-right) -->
  <rect rx="4" x="678" y="12" width="24" height="14" fill="#ffffff" stroke="#3182F6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="708" y="24" font-size="10" fill="#191F28">LLM 호출</text>
  <rect rx="4" x="800" y="12" width="24" height="14" fill="#ffffff" stroke="#E5E8EB" stroke-width="1"/>
  <text x="830" y="24" font-size="10" fill="#191F28">알고리즘 · 결정론적</text>

  <!-- ===== Row 1 ===== -->
  <!-- STEP 1 : LLM -->
  <g>
    <rect rx="8" x="20" y="40" width="300" height="132" fill="#ffffff" stroke="#3182F6" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="36" y="64" font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8B95A1">STEP 1</text>
    <text x="304" y="64" font-size="10" font-weight="700" text-anchor="end" fill="#3182F6">LLM</text>
    <text x="36" y="92" font-size="15" font-weight="700" fill="#191F28">조건 정규화</text>
    <text x="36" y="118" font-size="10.5" fill="#8B95A1">입력: 목적·인원·시간·지역·예산·선호</text>
    <text x="36" y="138" font-size="10.5" fill="#8B95A1">자유 텍스트 → 검증 가능한 태그 + 취향</text>
  </g>
  <line x1="322" y1="106" x2="338" y2="106" stroke="#E5E8EB" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- STEP 1.5 : 외부 API -->
  <g>
    <rect rx="8" x="340" y="40" width="300" height="132" fill="#ffffff" stroke="#E5E8EB" stroke-width="1"/>
    <text x="356" y="64" font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8B95A1">STEP 1.5</text>
    <text x="624" y="64" font-size="10" font-weight="700" text-anchor="end" fill="#8B95A1">외부 API</text>
    <text x="356" y="92" font-size="15" font-weight="700" fill="#191F28">네이버 지역검색</text>
    <text x="356" y="118" font-size="10.5" fill="#8B95A1">카테고리 16종 × 태그만큼 팬아웃</text>
    <text x="356" y="138" font-size="10.5" fill="#8B95A1">실재하는 장소만으로 후보 풀 구성</text>
  </g>
  <line x1="642" y1="106" x2="658" y2="106" stroke="#E5E8EB" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- STEP 2 : LLM + 알고리즘 -->
  <g>
    <rect rx="8" x="660" y="40" width="300" height="132" fill="#ffffff" stroke="#3182F6" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="676" y="64" font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8B95A1">STEP 2</text>
    <text x="944" y="64" font-size="10" font-weight="700" text-anchor="end" fill="#3182F6">LLM + 알고리즘</text>
    <text x="676" y="92" font-size="15" font-weight="700" fill="#191F28">후보 생성 · 3관점 병렬</text>
    <text x="676" y="118" font-size="10.5" fill="#8B95A1">가성비 / 동선최소 / 취향반영</text>
    <text x="676" y="138" font-size="10.5" fill="#8B95A1">검색 풀 안에서만 선택 → 환각 차단</text>
  </g>

  <!-- Wrap connector: STEP 2 → STEP 3-① -->
  <path d="M960,106 L980,106 L980,211 L20,211 L20,244" fill="none" stroke="#E5E8EB" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===== Row 2 ===== -->
  <!-- STEP 3-① : 알고리즘 -->
  <g>
    <rect rx="8" x="20" y="250" width="300" height="132" fill="#ffffff" stroke="#E5E8EB" stroke-width="1"/>
    <text x="36" y="274" font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8B95A1">STEP 3-①</text>
    <text x="304" y="274" font-size="10" font-weight="700" text-anchor="end" fill="#8B95A1">알고리즘 · 결정론적</text>
    <text x="36" y="302" font-size="15" font-weight="700" fill="#191F28">규칙 기반 하드 필터</text>
    <text x="36" y="328" font-size="10.5" fill="#8B95A1">시간겹침·예산초과·이동거리·태그중복</text>
    <text x="36" y="348" font-size="10.5" fill="#8B95A1">좌표와 시각만으로 코드가 확정 판단</text>
  </g>
  <line x1="322" y1="316" x2="338" y2="316" stroke="#E5E8EB" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- STEP 3-② : LLM -->
  <g>
    <rect rx="8" x="340" y="250" width="300" height="132" fill="#ffffff" stroke="#3182F6" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="356" y="274" font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8B95A1">STEP 3-②</text>
    <text x="624" y="274" font-size="10" font-weight="700" text-anchor="end" fill="#3182F6">LLM</text>
    <text x="356" y="302" font-size="15" font-weight="700" fill="#191F28">LLM 1회 호출</text>
    <text x="356" y="328" font-size="10.5" fill="#8B95A1">규칙을 통과한 후보만 대상으로</text>
    <text x="356" y="348" font-size="10.5" fill="#8B95A1">의미적 태그 위반 판단 + 추천 이유</text>
  </g>
  <line x1="642" y1="316" x2="658" y2="316" stroke="#E5E8EB" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- STEP 4 : 알고리즘 -->
  <g>
    <rect rx="8" x="660" y="250" width="300" height="132" fill="#ffffff" stroke="#E5E8EB" stroke-width="1"/>
    <text x="676" y="274" font-size="10" font-weight="700" letter-spacing="0.05em" fill="#8B95A1">STEP 4</text>
    <text x="944" y="274" font-size="10" font-weight="700" text-anchor="end" fill="#8B95A1">알고리즘 · LLM 없음</text>
    <text x="676" y="302" font-size="15" font-weight="700" fill="#191F28">동선 보강</text>
    <text x="676" y="328" font-size="10.5" fill="#8B95A1">선택된 후보에만 ODsay·NCP 호출</text>
    <text x="676" y="348" font-size="10.5" fill="#8B95A1">도보·대중교통·자차 경로 + 시간 보정</text>
  </g>

  <text x="500" y="410" text-anchor="middle" font-size="10" fill="#8B95A1">STEP 3-② 이후 · 후보 3개를 제시하고, 사용자가 고른 1개에만 STEP 4를 실행해 외부 경로 API 호출을 아낀다</text>
</svg>
